[package]
name = "mysql_bench"
version = "0.1.0"
edition = "2021"
publish = false

# Published crate — recognizer reuse API + perf improvements (v0.12.0).
[dependencies]
antlr-rust-runtime = "0.12.0"

[build-dependencies]
serde_json = "1"

[lib]
name = "mysql_bench"
path = "src/lib.rs"

[[bin]]
name = "mysql-benchmark"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
